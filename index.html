<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============ Primary SEO ============ -->
    <title>FRP &amp; GRC Architectural Products | Blue Star Plastic Industries</title>
    <meta
      name="description"
      content="Premium FRP & GRC architectural products — chajjas, jali panels, cornices, columns, domes, balustrades & planters. Made to order, pan-India supply. Custom quote in 24 h."
    />

    <meta name="author" content="Blue Star Plastic Industries" />
    <meta name="theme-color" content="#0c1e3a" />

    <!-- ============ Open Graph (WhatsApp, Facebook, LinkedIn shares) ============ -->
    <meta property="og:site_name" content="Blue Star Plastic Industries" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Blue Star Plastic Industries — Premium FRP & GRC Architectural Products" />

      property="og:description"
      content="Chajjas, jali panels, cornices, columns, domes, balustrades & planters — made to order at our Navi Mumbai works, supplied pan-India. Custom quote in 24 h: +91 91520 91020."
    />
    <!-- 1200×630 brand card (navy / amber). Swap for your hosted asset at the same spec:
         e.g. https://your-domain.com/og-share.png — crawlers require an absolute URL. -->
    <meta
      property="og:image"
      content="https://placehold.co/1200x630/0c1e3a/f5a81c/png?text=BLUE+STAR%0APLASTIC+INDUSTRIES&font=oswald"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Blue Star Plastic Industries — Premium FRP & GRC Architectural Products" />

    <!-- ============ Twitter / X Card ============ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blue Star Plastic Industries — Premium FRP & GRC Architectural Products" />
    <meta
      name="twitter:description"
      content="Chajjas, jali panels, cornices, columns, domes, balustrades & planters — made to order, supplied pan-India. Custom quote in 24 h."

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
